<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Widgets API — Scalar</title>
  <style>html, body { margin: 0; height: 100%; }</style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  <script>
    // IATI brand accent (matches the Sphinx theme brand colour #155366).
    // Change this single value to re-theme the whole reference.
    const IATI_ACCENT = '#155366';
    Scalar.createApiReference('#app', {
      url: '../openapi/test-widget-api.yaml',
      theme: 'default',
      layout: 'modern',
      hideDarkModeToggle: false,
      customCss: `
        :root {
          --scalar-color-accent: ${IATI_ACCENT};
          --scalar-link-color: ${IATI_ACCENT};
        }
        .dark-mode { --scalar-color-accent: #7bedf2; }
      `,
    });
  </script>
</body>
</html>
